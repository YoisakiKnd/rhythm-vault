name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test packages apps/web/src/lib apps/web/src/routes
      - run: bun run build
