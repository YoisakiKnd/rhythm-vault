# 生产编排：Caddy 独占 80/443，应用不对外暴露 3000。
# 镜像从 GHCR 拉取，不在服务器上 build。
#
#   cp .env.prod.example .env   # 填域名、密钥、GHCR_OWNER
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

x-log: &log
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: rhythm_vault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rv -d rhythm_vault']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *log

  migrate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/rhythm-vault-worker:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://rv:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rhythm_vault
    command: ['bun', 'run', '--cwd', 'packages/db', 'migrate']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *log

  sync-songs:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/rhythm-vault-worker:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://rv:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rhythm_vault
      RV_DATA_DIR: /app/packages/data
    volumes:
      - library:/app/packages/data
    command: ['bun', 'run', '--cwd', 'apps/worker', 'sync:songs']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    logging: *log

  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/rhythm-vault-web:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rv:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rhythm_vault
      RV_DATA_DIR: /app/packages/data
      RV_COVER_DIR: /app/.cache/covers
      ORIGIN: ${BASE_URL:?BASE_URL is required}
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      DATABASE_POOL_MAX: '10'
    volumes:
      - library:/app/packages/data:ro
      - covers:/app/.cache/covers
    depends_on:
      sync-songs:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *log

  worker:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/rhythm-vault-worker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rv:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rhythm_vault
      RV_DATA_DIR: /app/packages/data
      DATABASE_POOL_MAX: '5'
    volumes:
      - library:/app/packages/data:ro
    depends_on:
      sync-songs:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *log

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      RV_DOMAIN: ${RV_DOMAIN:?RV_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *log

volumes:
  pgdata:
  library:
  covers:
  caddy_data:
  caddy_config:
